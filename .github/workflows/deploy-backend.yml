name: Deploy Backend

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set image tag
        run: echo "IMAGE_TAG=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew :green-link-admin-api:bootJar --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/green-link-admin-api
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:${{ env.IMAGE_TAG }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TAG=${{ env.IMAGE_TAG }}
            DOCKER_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:$TAG"
            CONTAINER_NAME="green-link-admin-api"

            echo ">>> 배포 시작: $DOCKER_IMAGE"

            PREV_TAG=$(docker inspect --format='{{.Config.Image}}' $CONTAINER_NAME 2>/dev/null | cut -d: -f2 || echo "")

            if ! docker pull $DOCKER_IMAGE; then
              echo ">>> pull 실패. 배포를 중단합니다."
              exit 1
            fi

            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            if ! docker run -d \
              --name $CONTAINER_NAME \
              --env-file /home/ubuntu/green-link/.env.server \
              -e SPRING_PROFILES_ACTIVE=dev \
              -v /home/ubuntu/green-link/logs:/app/logs \
              -p 8080:8080 \
              --restart always \
              $DOCKER_IMAGE; then
              echo ">>> 컨테이너 시작 실패."
              if [ -n "$PREV_TAG" ]; then
                echo ">>> 이전 버전($PREV_TAG)으로 롤백합니다."
                docker run -d \
                  --name $CONTAINER_NAME \
                  --env-file /home/ubuntu/green-link/.env.server \
                  -e SPRING_PROFILES_ACTIVE=dev \
                  -v /home/ubuntu/green-link/logs:/app/logs \
                  -p 8080:8080 \
                  --restart always \
                  "${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:$PREV_TAG"
              fi
              exit 1
            fi

            echo ">>> 배포 완료: $DOCKER_IMAGE"

            echo ">>> 이전 이미지 정리 중..."
            docker images ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api --format "{{.Tag}}" | grep -v "^$TAG$" | xargs -r -I{} docker rmi ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:{} 2>/dev/null || true
            echo ">>> 이미지 정리 완료"
