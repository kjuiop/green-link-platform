name: Deploy Backend (dev)

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set image tag
        run: echo "IMAGE_TAG=dev-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew :green-link-admin-api:bootJar --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/green-link-admin-api
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to server via SSM
        run: |
          TAG=${{ env.IMAGE_TAG }}
          DOCKER_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:$TAG"
          CONTAINER_NAME="green-link-backend-dev"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'TAG=$TAG',
              'DOCKER_IMAGE=$DOCKER_IMAGE',
              'CONTAINER_NAME=$CONTAINER_NAME',
              'echo \">>> 배포 시작 (dev): \$DOCKER_IMAGE\"',
              'if ! docker pull \$DOCKER_IMAGE; then echo \">>> pull 실패\"; exit 1; fi',
              'docker stop \$CONTAINER_NAME 2>/dev/null || true',
              'docker rm \$CONTAINER_NAME 2>/dev/null || true',
              'if ! docker run -d --name \$CONTAINER_NAME --env-file /home/ubuntu/green-link/.env.dev -e SPRING_PROFILES_ACTIVE=dev -v /home/ubuntu/green-link/logs/dev:/app/logs -p 127.0.0.1:8081:8080 --restart always \$DOCKER_IMAGE; then echo \">>> 컨테이너 시작 실패\"; exit 1; fi',
              'echo \">>> 배포 완료 (dev): \$DOCKER_IMAGE\"',
              'docker images ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api --format \"{{.Tag}}\" | grep -v \"^\$TAG\$\" | grep \"^dev-\" | xargs -r -I{} docker rmi ${{ secrets.DOCKER_HUB_USERNAME }}/green-link-admin-api:{} 2>/dev/null || true',
              'echo \">>> 이미지 정리 완료\"'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
