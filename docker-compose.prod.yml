services:
  backend-prod:
    image: ${DOCKER_IMAGE:-kjuiop/green-link-admin-api:latest}
    container_name: green-link-backend-prod
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.prod
    volumes:
      - ./logs/prod:/app/logs
    restart: always

  shop-api-prod:
    image: ${SHOP_DOCKER_IMAGE:-kjuiop/green-shop-api:latest}
    container_name: green-shop-api-prod
    ports:
      - "127.0.0.1:8083:8080"
    env_file:
      - .env.shop.prod
    volumes:
      - ./logs/shop-prod:/app/logs
    restart: always
