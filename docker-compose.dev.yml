services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: green-link-backend:dev
    container_name: green-link-backend-dev
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.dev
    restart: always
    networks:
      - dev-net

  frontend-dev:
    build:
      context: ./frontend/downflower
      dockerfile: Dockerfile
    image: green-link-frontend:dev
    container_name: green-link-frontend-dev
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - API_URL=http://backend-dev:8080
    restart: always
    networks:
      - dev-net

networks:
  dev-net:
    name: green-link-dev
