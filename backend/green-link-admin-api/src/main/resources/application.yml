spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:43200000}

admin:
  init:
    login-id: ${ADMIN_INIT_LOGIN_ID:admin}
    password: ${ADMIN_INIT_PASSWORD}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}

aligo:
  key: ${ALIGO_KEY:}
  userid: ${ALIGO_USERID:}
  sender: ${ALIGO_SENDER:1855-4400}
  url: https://apis.aligo.in/send/

app:
  portal-base-url: ${PORTAL_BASE_URL:https://green-link-platform.vercel.app}

server:
  port: 8080
