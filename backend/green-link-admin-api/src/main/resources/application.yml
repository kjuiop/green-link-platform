spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/green_link?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  init:
    login-id: ${ADMIN_INIT_LOGIN_ID:admin}
    password: ${ADMIN_INIT_PASSWORD}

server:
  port: 8080
