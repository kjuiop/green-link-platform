spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:43200000}

admin:
  init:
    login-id: ${ADMIN_INIT_LOGIN_ID:admin}
    password: ${ADMIN_INIT_PASSWORD}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}


aligo:
  key: ${ALIGO_KEY:}
  userid: ${ALIGO_USERID:}
  sender: ${ALIGO_SENDER:1855-4400}
  url: https://apis.aligo.in/send/

barobill:
  # 프로필(dev/prod)별 기본값이 있으며, BAROBILL_URL 환경변수로 덮어쓸 수 있음
  url: ${BAROBILL_URL:https://testws.baroservice.com/SMS.asmx}

coupang:
  base-url: https://api-gateway.coupang.com
  credential-key: ${COUPANG_CRED_KEY:}
  collect:
    enabled: ${COUPANG_COLLECT_ENABLED:false}
    interval-ms: 240000
    overlap-minutes: 10
    max-range-hours: 24
  approve:
    verify-live: true

app:
  portal-base-url: ${PORTAL_BASE_URL:https://green-link-platform.vercel.app}

server:
  port: 8080
