spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
logging:
  level:
    root: INFO
    com.greenlink: INFO
  file:
    name: /app/logs/green-link-admin-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

barobill:
  url: ${BAROBILL_URL:https://ws.baroservice.com/SMS.asmx}
