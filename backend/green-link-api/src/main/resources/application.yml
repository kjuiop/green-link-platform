spring:
  datasource:
    url: jdbc:mysql://localhost:3306/green_link?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: green-link-jwt-secret-key-must-be-32bytes!!
  expiration: 86400000

server:
  port: 8080
