plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // BCrypt (Security 풀스택 없이 암호화만)
    implementation 'org.springframework.security:spring-security-crypto'

    // AWS SDK v2 S3
    implementation platform('software.amazon.awssdk:bom:2.25.70')
    implementation 'software.amazon.awssdk:s3'

    // QueryDSL (Jakarta)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:5.6.1:jakarta'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:5.6.1:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
}

sourceSets {
    main {
        java {
            srcDir 'build/generated/sources/annotationProcessor/java/main'
        }
    }
}
