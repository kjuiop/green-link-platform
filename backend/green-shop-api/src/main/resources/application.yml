spring:
  datasource:
    url: ${SHOP_DB_URL}
    username: ${SHOP_DB_USERNAME}
    password: ${SHOP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${SHOP_JWT_SECRET}
  expiration: ${SHOP_JWT_EXPIRATION:1800000}

shop:
  identity:
    base-url: ${ONURIM_API_BASE_URL:}
    secret: ${SHOP_INTERNAL_SECRET:}
  proxy:
    # shop-admin 앱(Vercel) 서버가 실제 사용자 IP를 X-Shop-Client-Ip 로 전달할 때 쓰는 공유 시크릿. 비우면 비활성
    secret: ${SHOP_PROXY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
